spring.application.name=enfermeria-backend

# Puerto del servidor
server.port=8080

# Base de datos H2 en memoria (solo para pruebas del laboratorio)
spring.datasource.url=jdbc:h2:mem:enfermeriadb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 para ver las tablas en el navegador
spring.h2.console.enabled=true

# Hibernate crea las tablas automaticamente a partir de las entidades @Entity
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Carga datos de prueba desde data.sql despues de crear las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always